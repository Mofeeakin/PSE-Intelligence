databases:
  - name: pse-compliance-db
    databaseName: pse_compliance
    plan: free

services:
  - type: web
    name: pse-compliance-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health/
    envVars:
      # Auto-injected by Render from the database resource above
      - key: DATABASE_URL
        fromDatabase:
          name: pse-compliance-db
          property: connectionString

      # Secrets — set manually in the Render dashboard (Environment tab)
      - key: SECRET_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # Non-secret config — safe to commit
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: LLM_PROVIDER
        value: deepseek
